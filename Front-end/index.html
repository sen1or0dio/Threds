<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Threds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="script.js?v=10" defer></script>
</head>
<body>
    
    <div class="registration-main-block">
        <div class="registration-content">
            <h1 class="registration-title">Welcome to Threds</h1>
            <input type="text" placeholder="Username" class="username-input">
            <input type="password" placeholder="Password" class="password-input">
            <button class="login-button">Login</button>
            <button class="registration-button">Register</button>
            <p class="auth-toggle" id="auth-toggle">Нет аккаунта? Зарегистрируйся!</p>
        </div>
    </div>

    <main>
        <section class="main-section">
            <div class="home-content">
                <div class="home-header">
                    <h1>Threds</h1>
                </div>

                <p class="page-label" id="page-label">Main Page</p>

                <div class="posts-container">
                    <!-- Посты будут добавляться сюда -->
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item" data-page="home">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item" data-page="users">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
            <span>Люди</span>
        </a>
        <a href="#" class="nav-item" data-page="myposts">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
            </svg>
            <span>Мои посты</span>
        </a>
        <a href="#" class="nav-item logout-item" id="logout-button">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
            <span>Выйти</span>
        </a>
    </nav>

    <button class="add-post-button" id="add-post-button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/>
        </svg>
    </button>

    <div class="modal-overlay" id="add-post-modal">
        <div class="modal">
            <p class="modal-text">Новый пост</p>
            <textarea class="new-post-input" placeholder="Что ты думаешь?"></textarea>
            <div class="modal-buttons">
                <button class="modal-cancel" id="add-post-cancel">Отмена</button>
                <button class="modal-confirm" id="add-post-submit">Опубликовать</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <p class="modal-text">Точно хотите удалить пост?</p>
            <div class="modal-buttons">
                <button class="modal-cancel" id="delete-cancel" onclick="cancelDelete()">Отмена</button>
                <button class="modal-confirm" id="delete-confirm" onclick="confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

</body>
</html>
